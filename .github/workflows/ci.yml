name: CI

on:
  push:
    branches: [main]
    tags: ['v*']            # a tag is what releases; see the publish job
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One leg failing should not cancel the others — we want every result.
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      # Thresholds in vitest.config.ts are a regression ratchet, not the target.
      - name: Test with coverage
        run: npm run test:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      # Word stamps its own user name into /Author every time a PDF is
      # exported, whatever the source document says, so a clean .docx does not
      # keep it out and remembering to strip it has already failed once.
      - name: No personal identifiers in tracked files
        run: npm run check:pii

      # Runtime dependencies are what reaches users, and are held at zero
      # advisories. This step fails the job if that regresses.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      # Build and test tooling never ships. Reported for visibility only —
      # see the dependency policy in SECURITY.md.
      - name: Audit all dependencies (informational)
        run: npm audit || true

  quickstart:
    name: Quickstart (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Bootstrap
        run: npm run bootstrap

      - name: Startup smoke test
        run: npm run smoke:start

  # Single aggregate check, so branch protection has one stable name to require.
  #
  # Requiring the matrix jobs directly does not work well: their check names
  # carry the matrix value (`Quickstart (ubuntu-latest)` and so on), so the
  # ruleset has to list every combination and be edited whenever the matrix
  # changes — and a name only becomes selectable after that job has actually
  # run at least once. Worse, a *skipped* required check never reports, which
  # leaves a pull request blocked forever.
  #
  # `if: always()` makes this run even when an upstream job fails or is
  # skipped, so it always reports a definite pass or fail.
  ci:
    name: CI
    if: always()
    needs: [test, coverage, audit, quickstart]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              success) ;;
              cancelled|skipped)
                # Usually GitHub failing to allocate a runner rather than a
                # defect — most often the macOS pool. Still a fail: a gate that
                # did not run has not passed. Re-run the workflow.
                echo "::error::a required job reported '$r' — it did not run, so nothing is verified. Re-run the workflow."
                exit 1 ;;
              *)
                echo "::error::a required job reported '$r'"
                exit 1 ;;
            esac
          done
          echo "all gates passed"

  publish:
    name: Publish to npm
    # Every gate must pass, not just the test matrix — a release should not be
    # able to ship with a known runtime advisory or a coverage regression.
    needs: [ci]
    runs-on: ubuntu-latest
    # A tag is the release trigger. This used to key off the head commit message
    # (`release:`), which broke once main required pull requests: whether that
    # message survives to the tip depends on the merge method chosen in the UI —
    # a merge commit silently skipped the publish after every gate had passed.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write        # OIDC, for both trusted publishing and provenance

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Node 20 ships npm 10, which has no OIDC support; trusted publishing needs
      # 11.5.1 or later. The major is pinned rather than tracking `latest`: npm 12
      # requires Node 22 or newer, so `npm@latest` fails to install on this job's
      # Node 20 — and npm 13 would do the same to Node 22 later.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Both halves matter. A tag that disagrees with package.json would publish
      # the wrong number under the right tag; a version already on the registry
      # would fail at the very last step, after every gate has already run.
      - name: Check the tag matches package.json and is unpublished
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            echo "Tag the release as v$VERSION, or bump package.json to ${TAG#v}."
            exit 1
          fi
          if npm view "agentsgate@$VERSION" version >/dev/null 2>&1; then
            echo "agentsgate@$VERSION is already on the registry — bump the version first."
            exit 1
          fi
          echo "Publishing agentsgate@$VERSION"

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: the package's trusted publisher is this workflow, so
      # npm authenticates over OIDC. That removes a long-lived secret from the
      # repository, removes the 90-day granular-token expiry, and lets the
      # package keep npm's strictest publishing-access setting.
      #
      # --ignore-scripts skips prepublishOnly, which re-runs lint, the full test
      # suite and the build. This job only starts once `ci` has passed all of
      # that across seven legs; repeating it here only adds a way for a release
      # to fail at the last step. prepublishOnly still guards a manual publish.
      #
      # --provenance signs an attestation tying the tarball to this run and
      # commit, so consumers can verify what they install was built from here.
      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts
