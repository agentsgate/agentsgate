version: "3.9"

services:
  agentsgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentsgate:latest
    container_name: agentsgate
    restart: unless-stopped

    ports:
      # Dashboard API
      - "3000:3000"
      # MCP proxy port
      - "3100:3100"

    user: "1001:1001"

    volumes:
      # Persist SQLite database and shadow git repo
      - ./data:/app/data

    environment:
      NODE_ENV: production
      # Set your API key for the dashboard. Leave empty to disable auth (not recommended for production).
      AGENTSGATE_API_KEY: ${AGENTSGATE_API_KEY:-}
      # Optional: Slack webhook URL for notifications
      # SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
